# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "af73f5c2382af3a5bfe9bc5ce26eb239"
name = "Scopegen Negotiator"
application_url = "https://noodle.scopegen.in"
embedded = true

[build]
# false, not true - this app is live in production at application_url below.
# When true (the template default), every `shopify app dev` run silently
# overwrites application_url/redirect_urls in Shopify's registered config
# with that session's throwaway trycloudflare.com tunnel URL - which is
# exactly what broke the embedded app in production (confirmed directly:
# the merchant's browser was trying to load a dead
# subscriber-chubby-likely-regards.trycloudflare.com tunnel, not
# noodle.scopegen.in, after a local `npm run dev` session silently clobbered
# the deployed config). With this false, local dev no longer touches the
# production URLs at all - it uses SHOPIFY_APP_URL from the pulled/local env
# instead. Re-enable only temporarily if actually testing via a dev tunnel
# again, and remember to flip it back before the next deploy.
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# Kept to exactly what's used so far: read_products (widget needs product/
# price data), write_draft_orders + read_draft_orders (the confirmed
# checkout mechanism), write_app_proxy (required just to configure the
# [app_proxy] block below - the storefront-facing negotiation endpoints).
# Add more only when a feature that needs them is actually built - see the
# brief's note on minimizing requested scope surface.
scopes = "read_products,write_draft_orders,read_draft_orders,write_app_proxy"

# Storefront widget calls https://{shop}/apps/negotiate/* ; Shopify verifies
# and signs the request, then proxies it to this app at /proxy/*.
# authenticate.public.appProxy() (used in app/routes/proxy.*.tsx) checks that
# signature - so a spoofed shop= parameter from the client can't be trusted,
# only what Shopify itself signs.
[app_proxy]
url = "/proxy"
prefix = "apps"
subpath = "negotiate"

[auth]
redirect_urls = [ "https://noodle.scopegen.in/auth/callback" ]
